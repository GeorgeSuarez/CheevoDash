name: Deploy flow diagram

# Publishes flow-diagram.html to the gh-pages branch (as index.html)
# whenever it changes on main. Pages is configured to serve gh-pages.

on:
  push:
    branches: [main]
    paths:
      - "flow-diagram.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-flow-diagram
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Push diagram to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p _deploy
          cp flow-diagram.html _deploy/index.html
          cd _deploy
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -qm "Deploy flow diagram from ${SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
